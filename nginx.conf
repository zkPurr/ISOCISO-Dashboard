server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The app ships unhashed ES modules that import each other by path. Caching
  # them means a rebuild can leave a browser holding a stale module next to a
  # fresh one — and a stale module is not a slightly old app, it is a broken
  # one: the import still resolves, then throws on the changed interface and
  # the whole render dies, leaving an empty shell.
  #
  # "no-cache" does not mean "do not store", it means "revalidate first", so
  # ETag turns the normal case into a 304 with no body. Cheap and correct.
  # Swap to a long max-age only for filenames carrying a content hash.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }
}
