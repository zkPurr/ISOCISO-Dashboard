<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>debug</title></head>
<body>
<pre id="out" style="font:12px monospace;white-space:pre-wrap"></pre>
<div class="app" id="app"><aside id="sidebar"></aside><div class="main"><header id="topbar"></header><main id="view"></main></div></div>
<div id="toasts"></div><div id="viz-tooltip" hidden></div>
<script>
  window.__errors = [];
  const out = document.getElementById('out');
  const log = (m) => { window.__errors.push(m); out.textContent += m + '\n'; };
  window.addEventListener('error', e => log('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => log('REJECT: ' + (e.reason?.stack || e.reason)));
</script>
<script type="module">
  try {
    await import('./src/main.js?debug=' + Date.now());
    window.__errors.push('MODULE LOADED OK');
    document.getElementById('out').textContent += 'MODULE LOADED OK\n';
  } catch (e) {
    window.__errors.push('IMPORT THREW: ' + (e.stack || e));
    document.getElementById('out').textContent += 'IMPORT THREW: ' + (e.stack || e) + '\n';
  }
</script>
</body></html>
